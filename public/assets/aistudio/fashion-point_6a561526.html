<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফ্যাশন পয়েন্ট | Fashion Point – Style for Everyone</title>
<meta name="description" content="০–১০ বছর বয়সী শিশুদের পোশাকসহ নারী-পুরুষের শার্ট, প্যান্ট, থ্রি-পিস, ওড়না, গজ ও থান কাপড় খুচরা ও পাইকারি বিক্রি করা হয়।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10265a;--navy2:#0b1c45;--pink:#e5195f;--pink2:#fde8f0;--yellow:#ffc928;--ink:#1d2342;--mut:#626a85;--line:#e4e7f0;--tint:#f3f5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Anek Bangla','Baloo Da 2','Hind Siliguri',system-ui,sans-serif;color:var(--ink);background:#dfe5f1;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
svg{flex-shrink:0}
.wrap{max-width:1180px;margin:0 auto;background:#fff;min-height:100vh}
.top{background:var(--navy);color:#fff;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 20px}
.top .c{display:flex;gap:26px}.top .c a{display:flex;gap:8px;align-items:center;line-height:1.2;font-weight:700;font-size:15.5px}.top .c small{display:block;font-size:13px;font-weight:600;opacity:.9}
.top .wa{width:26px;height:26px;border-radius:50%;background:#25d366;display:grid;place-items:center}
.top>span{display:flex;gap:8px;align-items:center}
header{display:flex;align-items:center;gap:28px;padding:10px 20px;border-bottom:1px solid var(--line)}
.logo img{height:68px;width:auto}
.search{flex:1;max-width:470px;display:flex;border:1px solid #d9dded;border-radius:40px;padding:4px 4px 4px 16px;align-items:center;gap:8px;background:#fff;color:var(--mut)}
.search input{flex:1;border:0;outline:0;min-width:0;background:none}
.search button{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center}
.icons{display:flex;gap:26px;margin-left:auto}
.icons a{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:600;line-height:1.2;text-align:center;position:relative;color:var(--ink)}
.icons a:hover{color:var(--pink)}
.bd{position:absolute;top:-8px;right:-2px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

.menu{display:none}.maddr{display:none}
nav.main{background:var(--navy);display:flex;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
nav.main a{color:#fff;padding:14px 16px;white-space:nowrap;font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center}
nav.main a:hover,nav.main a.on{background:var(--pink)}
.hero{position:relative;overflow:hidden;background:#fff}
.track{display:flex;transition:transform .6s}
.slide{min-width:100%;position:relative}
.slide>img{width:100%}
.s2{display:flex;align-items:center;justify-content:space-between;padding:0 6%;aspect-ratio:897/228;gap:20px}
.s2 h2{font-size:clamp(18px,3.6vw,38px);color:var(--navy);line-height:1.2}
.s2 p{font-size:clamp(13px,1.8vw,18px);margin:4px 0 10px}
.s2 img{height:86%;border-radius:10px;box-shadow:0 6px 18px #0002}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;background:#fff9;border:1px solid #0002}.dots .on{background:var(--navy)}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:20px 20px 16px}
.cat{text-align:center;font-weight:600;font-size:15.5px;line-height:1.3}
.cat img{width:min(96px,100%);aspect-ratio:1;border-radius:50%;object-fit:cover;margin:0 auto 6px;transition:transform .2s}
.cat:hover img{transform:scale(1.07)}.cat:hover{color:var(--pink)}
.cat small{display:block;color:var(--mut);font-weight:500;font-size:13.5px}
.about{margin:6px 22px 0;border-radius:14px;background:linear-gradient(100deg,#eef2fb,#f9f2fa);display:grid;grid-template-columns:1fr 1fr;align-items:center;overflow:hidden}
.about .t{padding:20px 24px}
.pill{display:inline-block;background:var(--pink);color:#fff;font-weight:700;font-size:14px;padding:1px 18px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.about h2{font-size:32px;color:var(--navy);line-height:1.2;margin:2px 0 4px}.about h2 span{color:var(--pink)}
.about p{font-size:15.5px;line-height:1.5}
.btn{display:inline-flex;gap:8px;align-items:center;background:var(--pink);color:#fff;padding:8px 22px;border-radius:30px;font-weight:600;font-size:15.5px;margin-top:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}.btn.o{background:#fff;color:var(--pink);border:1.5px solid var(--pink)}.btn.n{background:var(--navy)}
.about img{width:100%;height:100%;object-fit:cover}
.sec{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 14px;font-size:27px;color:var(--navy);font-weight:700}
.sec::before,.sec::after{content:"";width:44px;height:3px;background:var(--pink);border-radius:2px}
.prods{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:0 22px 22px}
.p{position:relative;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;display:flex;flex-direction:column}
.p .im{display:block;background:var(--tint);aspect-ratio:1.45;overflow:hidden;border-radius:4px}
.p .im img{width:100%;height:100%;object-fit:cover}
.p h3{font-size:15.5px;font-weight:600;margin:8px 0 0;line-height:1.4;min-height:42px}
.p h3:hover{color:var(--pink)}
.pr{color:var(--pink);font-weight:700;font-size:18px}.pr small{font-size:13px;color:var(--mut);font-weight:600}
.add{width:100%;margin-top:6px;background:var(--pink);color:#fff;padding:7px 4px;border-radius:4px;font-weight:600;font-size:14.5px;display:flex;justify-content:center;gap:6px;align-items:center}
.add:hover{filter:brightness(1.1)}.add:active{transform:scale(.97)}
.hb{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#fffd;display:grid;place-items:center;color:#555;z-index:1}
.hb.on{color:var(--pink)}.hb.on svg{fill:var(--pink)}
.trust{background:var(--pink2);display:grid;grid-template-columns:repeat(4,1fr);padding:12px 8px;margin-top:6px}
.trust div{display:flex;gap:10px;align-items:center;justify-content:center;border-left:1px solid #f4bfd2;padding:0 8px;color:var(--pink);font-size:14.5px;line-height:1.3}
.trust div:first-child{border:0}.trust b{display:block;color:var(--ink);font-weight:600}.trust small{color:var(--mut);font-size:13px;font-weight:500}
footer{background:var(--navy2);color:#d9e1f6;padding:24px 22px 10px;display:grid;grid-template-columns:1.2fr 1.5fr 1.6fr 1fr;gap:22px;font-size:14.5px}
footer h4{color:#fff;font-size:16px;margin-bottom:8px}
footer ul{list-style:none;columns:2;column-gap:20px}footer li{margin-bottom:5px}footer a:hover{color:var(--yellow)}
footer img{height:54px;margin-bottom:8px}
footer p{margin-bottom:5px;display:flex;gap:8px}
.soc{display:flex;gap:8px;margin-top:2px}.soc a{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.sig{font-family:'Brush Script MT','Segoe Script',cursive;font-size:19px;color:#fff;margin-top:12px;line-height:1.2}.sig b{color:#ff6b9d}
.copy{grid-column:1/-1;text-align:center;font-size:13px;font-weight:500;border-top:1px solid #243b76;padding-top:10px;color:#9fb0dc}
.pg{padding:22px}
.crumb{font-size:14.5px;color:var(--mut);margin-bottom:12px}.crumb a:hover{color:var(--pink)}
h1.t{font-size:26px;color:var(--navy);margin-bottom:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:10px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips a{border:1px solid var(--line);padding:4px 14px;border-radius:20px;font-size:14px}.chips a.on,.chips a:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
select,.in{border:1px solid #d3d8e8;border-radius:8px;padding:9px 12px;background:#fff;width:100%}
.bar select{width:auto}
.pg .prods{padding:0}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}.empty svg{color:#c4c9dc;margin:0 auto 10px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.det .big{background:var(--tint);border-radius:10px;overflow:hidden;aspect-ratio:1.2}.det .big img{width:100%;height:100%;object-fit:cover}
.det h1{font-size:26px;color:var(--navy);line-height:1.3}.det .pr{font-size:28px;margin:8px 0}
.opt{margin:14px 0}.opt b{display:block;margin-bottom:6px}
.sz{display:flex;gap:8px;flex-wrap:wrap}.sz button{min-width:46px;padding:6px 12px;border:1.5px solid #cfd5e8;border-radius:8px;font-weight:600}.sz .on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qty{display:inline-flex;align-items:center;border:1px solid #cfd5e8;border-radius:8px;overflow:hidden}.qty button{width:34px;height:34px;font-size:18px}.qty button:hover{background:var(--pink2)}.qty span{min-width:36px;text-align:center;font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.acts .btn{margin:0}
.cr{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cr img{width:76px;height:60px;object-fit:cover;border-radius:6px}.cr h3{font-size:15px}.cr small{color:var(--mut)}
.cr .rt{text-align:right;display:grid;gap:6px;justify-items:end}.rm{color:#c33;display:flex;gap:4px;align-items:center;font-size:13px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:26px;align-items:start}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff}
.box h3{margin-bottom:10px;color:var(--navy)}
.row{display:flex;justify-content:space-between;padding:5px 0}.row.t{border-top:1px dashed #cdd3e6;margin-top:6px;padding-top:10px;font-weight:700;font-size:18px;color:var(--pink)}
.fg{display:grid;gap:12px}.fg label{font-size:14px;font-weight:600;display:grid;gap:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:grid;gap:8px}.pay label{display:flex;gap:10px;align-items:center;border:1.5px solid #d3d8e8;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer}
.pay input{accent-color:var(--pink)}.pay label:has(input:checked){border-color:var(--pink);background:var(--pink2)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}.tabs button{padding:8px 22px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}.tabs .on{color:var(--pink);border-color:var(--pink)}
.narrow{max-width:460px;margin:0 auto}
.ok{text-align:center;padding:20px 0}.ok .tick{width:70px;height:70px;border-radius:50%;background:#e4f8ec;color:#1b9e55;display:grid;place-items:center;margin:0 auto 10px}
.err{color:#c62828;font-size:14px;min-height:20px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#e8f0ff;color:var(--navy);font-size:13.5px;font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14.5px}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* PayBD Payment Gateway Styles */
.mh{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.mt{display:flex;align-items:center;gap:12px}
.mt img{height:52px;width:auto;max-width:46%;mix-blend-mode:multiply;flex-shrink:0}
.mt h1{font-family:'Anek Bangla','Hind Siliguri',Inter,sans-serif;font-size:clamp(20px,5.5vw,25px);line-height:1.2;font-weight:700;margin-left:auto;text-align:right;color:var(--navy)}
.mm{display:flex;justify-content:flex-start!important;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed #cfdcf0}
.mm small{display:block;font-size:12.5px;color:var(--mut)}
.mm b{display:block;white-space:nowrap;font-size:clamp(16px,5vw,21px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.cp{display:inline-flex;align-items:center;gap:6px;color:#2a80f5;font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;background:#eaf2ff;border:0;cursor:pointer}
.sum{background:#eef4fd;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum small{display:block;color:var(--mut);font-size:14px;margin-bottom:2px}
.amt{display:flex;align-items:center;gap:10px;font-size:clamp(28px,8vw,36px);font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--navy)}
.qr-btn{display:flex;align-items:center;justify-content:center;min-width:0;height:58px;padding:6px 14px;border:1px solid #c6d6ee;border-radius:10px;background:#f5f9ff;color:#8190ae;font-size:15px;font-weight:500;cursor:pointer}
.qr-btn img{height:44px;mix-blend-mode:multiply}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.m-card{position:relative;height:98px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fcfdff,#f5f9ff);display:flex;align-items:center;justify-content:center;padding-bottom:10px;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.m-card:hover{border-color:#a9c4ea}.m-card.on{border:2px solid #2a80f5;box-shadow:0 0 0 3px #2a80f526}
.m-card img{mix-blend-mode:multiply;max-width:84%;height:auto}
.m-card .ch{position:absolute;right:10px;bottom:8px}
.pay-now-btn{margin-top:16px;width:100%;min-height:52px;border-radius:13px;background:linear-gradient(180deg,#2d8af8,#1d73ef);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px #1d73ef33;border:0;cursor:pointer}
.pay-now-btn:active{transform:scale(.99)}
.pw-brand{text-align:center;margin-top:20px;color:#7787a5;font-size:13.5px;display:flex;gap:8px;justify-content:center;align-items:baseline}
.pw-brand b{font-size:19px;font-weight:800;color:#0b1d4a}.pw-brand b span{color:#16a34a}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;min-height:38px;margin-bottom:8px;border:0;background:none;cursor:pointer;font-size:14.5px}
.ph-box{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ph-box .band{background:var(--pc,#2a80f5);padding:16px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.ph-box .band div{font-size:13px;opacity:.92}.ph-box .band b{display:block;font-size:24px;font-weight:800;opacity:1}
.ph-box .lg{background:#fff;border-radius:12px;padding:6px 12px;display:grid;place-items:center;min-width:100px;height:58px}
.ph-box .lg img{max-height:44px;max-width:120px;width:auto;mix-blend-mode:multiply}
.p-num-box{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f2f7ff;border:1.5px dashed var(--pc,#2a80f5);border-radius:12px;padding:12px 14px;margin:10px 0 4px}
.p-num-box small{display:block;font-size:12.5px;color:var(--mut)}.p-num-box b{font-size:clamp(18px,5.5vw,23px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.p-num-box .cp{background:var(--pc,#2a80f5);color:#fff}
ol.p-steps{list-style:none;counter-reset:s;display:grid;gap:8px;margin:12px 0}
ol.p-steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
ol.p-steps li::before{content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;background:var(--pc,#2a80f5);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;margin-top:1px}
.cf-btn{width:100%;min-height:52px;border-radius:13px;background:var(--pc,#2a80f5);color:#fff;font-size:17.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer}
.qrbox{display:grid;place-items:center;padding:12px 0}.qrbox img{width:180px;height:auto;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;mix-blend-mode:multiply}
.rc-card{margin:14px 0;border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:#fff}
.rc-card div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #dbe4f3;font-size:14.5px}.rc-card div:last-child{border:0}.rc-card span{color:var(--mut)}.rc-card b{text-align:right;word-break:break-all}
.lk-btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font-weight:700;margin-top:10px;width:100%;text-decoration:none;font-size:15px}
.lk-btn.wa{background:#25d366;color:#fff}.lk-btn.ol{border:1.5px solid #2a80f5;color:#2a80f5;background:#fff}
.bottom,.drawer,.ov{display:none}
@media(max-width:860px){
body{background:#fff}
.top,.icons a:not(.cb){display:none}
.icons{margin-left:auto}
header{flex-wrap:wrap;gap:8px 10px;padding:10px 14px;border:0}
.menu{display:block;order:0;color:var(--navy)}
.logo{order:1}.logo img{height:52px}
.icons{order:2}.search{order:3;flex-basis:100%;max-width:none;padding:6px 6px 6px 16px}
.maddr{order:4;display:flex;gap:6px;font-size:13.5px;font-weight:500;color:#333;flex-basis:100%;align-items:flex-start}.maddr svg{color:var(--navy);margin-top:2px}
.header-gap{display:none}
nav.main{display:none}
.hero{min-height:0}.slide>img{height:150px;object-fit:cover;object-position:35% 50%}.s2{aspect-ratio:auto;height:150px}.s2 img{height:80%}
.dots{position:static;margin:8px 0 0}
.cats{grid-template-columns:repeat(3,1fr);gap:14px 6px;padding:14px 10px}
.cat img{width:78px}
.about{grid-template-columns:1fr;margin:6px 12px 0}.about h2{font-size:25px}.about img{max-height:190px}
.about .t{padding:14px}
.sec{font-size:22px;margin:20px 0 10px}.sec::before,.sec::after{width:30px}
.prods{grid-template-columns:repeat(2,1fr);padding:0 12px 18px;gap:10px}
.trust{grid-template-columns:1fr 1fr;gap:12px 0}.trust div{justify-content:flex-start;padding-left:14px}.trust div:nth-child(3){border-left:0}
footer{grid-template-columns:1fr;padding-bottom:20px}
.pg{padding:14px 12px}
.det,.two{grid-template-columns:1fr}.f2{grid-template-columns:1fr}
.wrap{padding-bottom:70px}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 -4px 14px #0001}
.bottom a{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;color:var(--mut);position:relative;min-width:56px}.bottom a.on{color:var(--pink)}
.bottom .bd{top:-4px;right:6px}
.ov{display:block;position:fixed;inset:0;background:#0007;z-index:50;opacity:0;pointer-events:none;transition:.25s}.ov.show{opacity:1;pointer-events:auto}

.drawer.show{transform:none}
.drawer .h{background:var(--navy);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
.drawer a{display:block;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600}.drawer a.on{color:var(--pink)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    if(!/^01[3-9]\d{8}$/.test(ph)){toast('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন: 01712345678)');return}
    if(!v.addr||!v.addr.trim()){toast('অনুগ্রহ করে সম্পূর্ণ ঠিকানা লিখুন');return}
    const s=cart.reduce((a,c)=>a+P[c.id-1].pr*c.qty,0),d=ship(s);
    const mode=v.pay||'cod';
    const payAmt=mode=='cod'?d:(s+d);
    const payRsn=mode=='cod'?'অ্যাডভান্স ফর ডেলিভারি চার্জ':'ফুল পেমেন্ট';
    pendingOrder={name:v.name.trim(),phone:ph,addr:v.addr.trim(),dist:(v.dist||'শরীয়তপুর').trim(),mode:mode,payAmount:payAmt,payReason:payRsn,subtotal:s,ship:d,total:s+d,items:cart.slice()};
    st.set('pendingOrder',pendingOrder);
    location.hash='#/payment';
    route();
  }
  if(f.id=='pf'){
    const er=$('#perr');
    let s=(v.s||'').replace(/\D/g,'');
    if(s.startsWith('8801'))s=s.slice(2);
    const t=(v.t||'').trim().toUpperCase(),wName=v.w||'পেমেন্ট';
    if(!/^01[3-9]\d{8}$/.test(s)){if(er)er.textContent='সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন';toast('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');return}
    if(!/^[A-Z0-9]{6,14}$/.test(t)){if(er)er.textContent='সঠিক Transaction ID দিন (যেমন: 8N7A6D5EE4)';toast('সঠিক Transaction ID দিন');return}
    if(!pendingOrder)pendingOrder=st.get('pendingOrder',null);
    if(!pendingOrder){toast('অর্ডারের তথ্য পাওয়া যায়নি, আবার চেষ্টা করুন');location.hash='#/checkout';route();return}
    const o={id:String(Date.now()).slice(-7),items:pendingOrder.items,subtotal:pendingOrder.subtotal,ship:pendingOrder.ship,total:pendingOrder.total,paidAmount:pendingOrder.payAmount,dueAmount:pendingOrder.total-pendingOrder.payAmount,payReason:pendingOrder.payReason,payMethod:`${wName} (${pendingOrder.payReason})`,trxId:t,senderPhone:s,name:pendingOrder.name,phone:pendingOrder.phone,addr:pendingOrder.addr,dist:pendingOrder.dist,status:'নতুন অর্ডার',date:new Date().toLocaleDateString('en-GB')};
    orders.unshift(o);cart=[];save();st.set('lastOrder',o);upd();lastOrder=o;
    if(window.db){try{window.db.collection('orders').doc(o.id).set(o)}catch(err){}}
    location.hash='#/payment-done';
    route();
  }
  if(f.id=='ct'){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(v.msg+'\n— '+v.name+', '+v.phone)}`,'_blank','noopener')}
  if(f.id=='au'){const us=st.get('users',{}),er=$('#er');if(f.dataset.m=='r'){if(!v.name){er.textContent='নাম লিখুন';return}if(us[v.phone]){er.textContent='এই নম্বরে আগেই অ্যাকাউন্ট আছে';return}us[v.phone]={name:v.name,phone:v.phone,pass:btoa(unescape(encodeURIComponent(v.pass)))};st.set('users',us);user={name:v.name,phone:v.phone}}else{const u=us[v.phone];if(!u||u.pass!=btoa(unescape(encodeURIComponent(v.pass)))){er.textContent='মোবাইল নম্বর বা পাসওয়ার্ড সঠিক নয়';return}user={name:u.name,phone:u.phone}}save();shell();route();toast('স্বাগতম, '+user.name)}
}
document.addEventListener('click',e=>{
const t=e.target.closest('button,a,[data-menu],[data-pay-wallet],[data-copy-num],[data-go-pay]');
if(!t)return;
const d=t.dataset;
if(t.type=='submit'||t.tagName=='BUTTON'&&t.closest('form')){
  const f=t.closest('form');
  if(f){e.preventDefault();processSubmit(f);return}
}
if(d.copyNum){copyText(d.copyNum,'নম্বর কপি হয়েছে')}
if(d.payWallet!==undefined){location.hash='#/payment/'+d.payWallet;route()}
if(d.goPay!==undefined){location.hash='#/payment';route()}
if(d.menu!==undefined&&t.tagName!='A'||(t.tagName=='A'&&d.menu!==undefined)){$('#dr').classList.toggle('show');document.querySelector('.ov').classList.toggle('show')}
if(d.a){addCart(+d.a)}
if(d.ad){addCart(+d.ad,sel.qty,sel.size)}
if(d.buy){addCart(+d.buy,sel.qty,sel.size);location.hash='#/checkout';route()}
if(d.w){const i=+d.w;wish.includes(i)?wish=wish.filter(x=>x!=i):wish.push(i);save();upd();toast(wish.includes(i)?'পছন্দের তালিকায় যোগ হয়েছে':'তালিকা থেকে সরানো হয়েছে');if(location.hash.startsWith('#/wishlist'))route();else document.querySelectorAll(`[data-w="${i}"].hb`).forEach(b=>b.classList.toggle('on',wish.includes(i)))}
if(d.sl!==undefined){go(+d.sl);clearInterval(slideT)}
if(d.sz){sel.size=d.sz;document.querySelectorAll('[data-sz]').forEach(b=>b.classList.toggle('on',b.dataset.sz==sel.size))}
if(d.sq){sel.qty=Math.max(1,sel.qty+ +d.sq);$('#sq').textContent=bn(sel.qty)}
if(d.cq){const[i,v]=d.cq.split(':');cart[i].qty=Math.max(1,cart[i].qty+ +v);save();route()}
if(d.rm!==undefined){cart.splice(+d.rm,1);save();route()}
if(d.allcart!==undefined){wish.forEach(i=>addCart(i));route()}
if(d.out!==undefined){user=null;save();shell();route();toast('লগআউট হয়েছে')}
if(d.tab){const r=d.tab=='r';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b==t));$('#nm').hidden=!r;$('#au').dataset.m=d.tab;$('#au button.btn').textContent=r?'রেজিস্টার করুন':'লগইন করুন';$('#er').textContent=''}
});
document.addEventListener('change',e=>{
if(e.target.id=='srt'){sortBy=e.target.value;route()}
if(e.target.name=='pay'){
  const s=cart.reduce((a,c)=>a+P[c.id-1].pr*c.qty,0),d=ship(s);
  const nt=$('#note-title'),nd=$('#note-desc');
  if(e.target.value=='cod'){
    if(nt)nt.textContent='অ্যাডভান্স ফর ডেলিভারি চার্জ: '+tk(d);
    if(nd)nd.textContent=`ক্যাশ অন ডেলিভারিতে অর্ডার করতে ডেলিভারি চার্জ (${tk(d)}) অগ্রিম পরিশোধ করতে হবে। বাকি ${tk(s)} টাকা ডেলিভারির সময় ক্যাশ পরিশোধ করবেন।`;
  }else{
    if(nt)nt.textContent='মোট পরিশোধযোগ্য: '+tk(s+d);
    if(nd)nd.textContent='বিকাশ, নগদ, রকেট, উপায়, সেলফিন বা কিউআর কোডের মাধ্যমে মোট টাকা অগ্রিম পরিশোধ করুন।';
  }
}
});
document.addEventListener('submit',e=>{e.preventDefault();processSubmit(e.target)});
function copyText(str,msg){
  function fallback(){const el=document.createElement('input');el.value=str;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast(msg)}catch(e){toast(str)}el.remove()}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(str).then(()=>toast(msg),fallback);else fallback();
}
let pendingOrder=st.get('pendingOrder',null);
let lastOrder=st.get('lastOrder',null);
window.addEventListener('hashchange',route);
shell();route();
</script>
</body>
</html>
