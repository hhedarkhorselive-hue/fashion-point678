<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফ্যাশন পয়েন্ট | Fashion Point – Style for Everyone</title>
<meta name="description" content="০–১০ বছর বয়সী শিশুদের পোশাকসহ নারী-পুরুষের শার্ট, প্যান্ট, থ্রি-পিস, ওড়না, গজ ও থান কাপড় খুচরা ও পাইকারি বিক্রি করা হয়।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10265a;--navy2:#0b1c45;--pink:#e5195f;--pink2:#fde8f0;--yellow:#ffc928;--ink:#1d2342;--mut:#626a85;--line:#e4e7f0;--tint:#f3f5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Anek Bangla','Baloo Da 2','Hind Siliguri',system-ui,sans-serif;color:var(--ink);background:#dfe5f1;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
svg{flex-shrink:0}
.wrap{max-width:1180px;margin:0 auto;background:#fff;min-height:100vh}
.top{background:var(--navy);color:#fff;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 20px}
.top .c{display:flex;gap:26px}.top .c a{display:flex;gap:8px;align-items:center;line-height:1.2;font-weight:700;font-size:15.5px}.top .c small{display:block;font-size:13px;font-weight:600;opacity:.9}
.top .wa{width:26px;height:26px;border-radius:50%;background:#25d366;display:grid;place-items:center}
.top>span{display:flex;gap:8px;align-items:center}
header{display:flex;align-items:center;gap:28px;padding:10px 20px;border-bottom:1px solid var(--line)}
.logo img{height:68px;width:auto}
.search{flex:1;max-width:470px;display:flex;border:1px solid #d9dded;border-radius:40px;padding:4px 4px 4px 16px;align-items:center;gap:8px;background:#fff;color:var(--mut)}
.search input{flex:1;border:0;outline:0;min-width:0;background:none}
.search button{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center}
.icons{display:flex;gap:26px;margin-left:auto}
.icons a{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:600;line-height:1.2;text-align:center;position:relative;color:var(--ink)}
.icons a:hover{color:var(--pink)}
.bd{position:absolute;top:-8px;right:-2px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.bd:empty{display:none}
.menu{display:none}.maddr{display:none}
nav.main{background:var(--navy);display:flex;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
nav.main a{color:#fff;padding:14px 16px;white-space:nowrap;font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center}
nav.main a:hover,nav.main a.on{background:var(--pink)}
.hero{position:relative;overflow:hidden;background:#fff}
.track{display:flex;transition:transform .6s}
.slide{min-width:100%;position:relative}
.slide>img{width:100%}
.s2{display:flex;align-items:center;justify-content:space-between;padding:0 6%;aspect-ratio:897/228;gap:20px}
.s2 h2{font-size:clamp(18px,3.6vw,38px);color:var(--navy);line-height:1.2}
.s2 p{font-size:clamp(13px,1.8vw,18px);margin:4px 0 10px}
.s2 img{height:86%;border-radius:10px;box-shadow:0 6px 18px #0002}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;background:#fff9;border:1px solid #0002}.dots .on{background:var(--navy)}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:20px 20px 16px}
.cat{text-align:center;font-weight:600;font-size:15.5px;line-height:1.3}
.cat img{width:min(96px,100%);aspect-ratio:1;border-radius:50%;object-fit:cover;margin:0 auto 6px;transition:transform .2s}
.cat:hover img{transform:scale(1.07)}.cat:hover{color:var(--pink)}
.cat small{display:block;color:var(--mut);font-weight:500;font-size:13.5px}
.about{margin:6px 22px 0;border-radius:14px;background:linear-gradient(100deg,#eef2fb,#f9f2fa);display:grid;grid-template-columns:1fr 1fr;align-items:center;overflow:hidden}
.about .t{padding:20px 24px}
.pill{display:inline-block;background:var(--pink);color:#fff;font-weight:700;font-size:14px;padding:1px 18px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.about h2{font-size:32px;color:var(--navy);line-height:1.2;margin:2px 0 4px}.about h2 span{color:var(--pink)}
.about p{font-size:15.5px;line-height:1.5}
.btn{display:inline-flex;gap:8px;align-items:center;background:var(--pink);color:#fff;padding:8px 22px;border-radius:30px;font-weight:600;font-size:15.5px;margin-top:12px;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}.btn.o{background:#fff;color:var(--pink);border:1.5px solid var(--pink)}.btn.n{background:var(--navy)}
.about img{width:100%;height:100%;object-fit:cover}
.sec{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 14px;font-size:27px;color:var(--navy);font-weight:700}
.sec::before,.sec::after{content:"";width:44px;height:3px;background:var(--pink);border-radius:2px}
.prods{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:0 22px 22px}
.p{position:relative;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;display:flex;flex-direction:column}
.p .im{display:block;background:var(--tint);aspect-ratio:1.45;overflow:hidden;border-radius:4px}
.p .im img{width:100%;height:100%;object-fit:cover}
.p h3{font-size:15.5px;font-weight:600;margin:8px 0 0;line-height:1.4;min-height:42px}
.p h3:hover{color:var(--pink)}
.pr{color:var(--pink);font-weight:700;font-size:18px}.pr small{font-size:13px;color:var(--mut);font-weight:600}
.add{width:100%;margin-top:6px;background:var(--pink);color:#fff;padding:7px 4px;border-radius:4px;font-weight:600;font-size:14.5px;display:flex;justify-content:center;gap:6px;align-items:center}
.add:hover{filter:brightness(1.1)}.add:active{transform:scale(.97)}
.hb{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#fffd;display:grid;place-items:center;color:#555;z-index:1}
.hb.on{color:var(--pink)}.hb.on svg{fill:var(--pink)}
.trust{background:var(--pink2);display:grid;grid-template-columns:repeat(4,1fr);padding:12px 8px;margin-top:6px}
.trust div{display:flex;gap:10px;align-items:center;justify-content:center;border-left:1px solid #f4bfd2;padding:0 8px;color:var(--pink);font-size:14.5px;line-height:1.3}
.trust div:first-child{border:0}.trust b{display:block;color:var(--ink);font-weight:600}.trust small{color:var(--mut);font-size:13px;font-weight:500}
footer{background:var(--navy2);color:#d9e1f6;padding:24px 22px 10px;display:grid;grid-template-columns:1.2fr 1.5fr 1.6fr 1fr;gap:22px;font-size:14.5px}
footer h4{color:#fff;font-size:16px;margin-bottom:8px}
footer ul{list-style:none;columns:2;column-gap:20px}footer li{margin-bottom:5px}footer a:hover{color:var(--yellow)}
footer img{height:54px;margin-bottom:8px}
footer p{margin-bottom:5px;display:flex;gap:8px}
.soc{display:flex;gap:8px;margin-top:2px}.soc a{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.sig{font-family:'Brush Script MT','Segoe Script',cursive;font-size:19px;color:#fff;margin-top:12px;line-height:1.2}.sig b{color:#ff6b9d}
.copy{grid-column:1/-1;text-align:center;font-size:13px;font-weight:500;border-top:1px solid #243b76;padding-top:10px;color:#9fb0dc}
.pg{padding:22px}
.crumb{font-size:14.5px;color:var(--mut);margin-bottom:12px}.crumb a:hover{color:var(--pink)}
h1.t{font-size:26px;color:var(--navy);margin-bottom:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:10px 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips a{border:1px solid var(--line);padding:4px 14px;border-radius:20px;font-size:14px}.chips a.on,.chips a:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
select,.in{border:1px solid #d3d8e8;border-radius:8px;padding:9px 12px;background:#fff;width:100%}
.bar select{width:auto}
.pg .prods{padding:0}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}.empty svg{color:#c4c9dc;margin:0 auto 10px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.det .big{background:var(--tint);border-radius:10px;overflow:hidden;aspect-ratio:1.2}.det .big img{width:100%;height:100%;object-fit:cover}
.det h1{font-size:26px;color:var(--navy);line-height:1.3}.det .pr{font-size:28px;margin:8px 0}
.opt{margin:14px 0}.opt b{display:block;margin-bottom:6px}
.sz{display:flex;gap:8px;flex-wrap:wrap}.sz button{min-width:46px;padding:6px 12px;border:1.5px solid #cfd5e8;border-radius:8px;font-weight:600}.sz .on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qty{display:inline-flex;align-items:center;border:1px solid #cfd5e8;border-radius:8px;overflow:hidden}.qty button{width:34px;height:34px;font-size:18px}.qty button:hover{background:var(--pink2)}.qty span{min-width:36px;text-align:center;font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.acts .btn{margin:0}
.cr{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cr img{width:76px;height:60px;object-fit:cover;border-radius:6px}.cr h3{font-size:15px}.cr small{color:var(--mut)}
.cr .rt{text-align:right;display:grid;gap:6px;justify-items:end}.rm{color:#c33;display:flex;gap:4px;align-items:center;font-size:13px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:26px;align-items:start}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff}
.box h3{margin-bottom:10px;color:var(--navy)}
.row{display:flex;justify-content:space-between;padding:5px 0}.row.t{border-top:1px dashed #cdd3e6;margin-top:6px;padding-top:10px;font-weight:700;font-size:18px;color:var(--pink)}
.fg{display:grid;gap:12px}.fg label{font-size:14px;font-weight:600;display:grid;gap:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:grid;gap:8px}.pay label{display:flex;gap:10px;align-items:center;border:1.5px solid #d3d8e8;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer}
.pay input{accent-color:var(--pink)}.pay label:has(input:checked){border-color:var(--pink);background:var(--pink2)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}.tabs button{padding:8px 22px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}.tabs .on{color:var(--pink);border-color:var(--pink)}
.narrow{max-width:460px;margin:0 auto}
.ok{text-align:center;padding:20px 0}.ok .tick{width:70px;height:70px;border-radius:50%;background:#e4f8ec;color:#1b9e55;display:grid;place-items:center;margin:0 auto 10px}
.err{color:#c62828;font-size:14px;min-height:20px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#e8f0ff;color:var(--navy);font-size:13.5px;font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14.5px}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* PayBD Payment Gateway Styles */
.mh{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.mt{display:flex;align-items:center;gap:12px}
.mt img{height:52px;width:auto;max-width:46%;mix-blend-mode:multiply;flex-shrink:0}
.mt h1{font-family:'Anek Bangla','Hind Siliguri',Inter,sans-serif;font-size:clamp(20px,5.5vw,25px);line-height:1.2;font-weight:700;margin-left:auto;text-align:right;color:var(--navy)}
.mm{display:flex;justify-content:flex-start!important;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed #cfdcf0}
.mm small{display:block;font-size:12.5px;color:var(--mut)}
.mm b{display:block;white-space:nowrap;font-size:clamp(16px,5vw,21px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.cp{display:inline-flex;align-items:center;gap:6px;color:#2a80f5;font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;background:#eaf2ff;border:0;cursor:pointer}
.sum{background:#eef4fd;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum small{display:block;color:var(--mut);font-size:14px;margin-bottom:2px}
.amt{display:flex;align-items:center;gap:10px;font-size:clamp(28px,8vw,36px);font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--navy)}
.qr-btn{display:flex;align-items:center;justify-content:center;min-width:0;height:58px;padding:6px 14px;border:1px solid #c6d6ee;border-radius:10px;background:#f5f9ff;color:#8190ae;font-size:15px;font-weight:500;cursor:pointer}
.qr-btn img{height:44px;mix-blend-mode:multiply}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.m-card{position:relative;height:98px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fcfdff,#f5f9ff);display:flex;align-items:center;justify-content:center;padding-bottom:10px;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.m-card:hover{border-color:#a9c4ea}.m-card.on{border:2px solid #2a80f5;box-shadow:0 0 0 3px #2a80f526}
.m-card img{mix-blend-mode:multiply;max-width:84%;height:auto}
.m-card .ch{position:absolute;right:10px;bottom:8px}
.pay-now-btn{margin-top:16px;width:100%;min-height:52px;border-radius:13px;background:linear-gradient(180deg,#2d8af8,#1d73ef);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px #1d73ef33;border:0;cursor:pointer}
.pay-now-btn:active{transform:scale(.99)}
.pw-brand{text-align:center;margin-top:20px;color:#7787a5;font-size:13.5px;display:flex;gap:8px;justify-content:center;align-items:baseline}
.pw-brand b{font-size:19px;font-weight:800;color:#0b1d4a}.pw-brand b span{color:#16a34a}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;min-height:38px;margin-bottom:8px;border:0;background:none;cursor:pointer;font-size:14.5px}
.ph-box{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ph-box .band{background:var(--pc,#2a80f5);padding:16px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.ph-box .band div{font-size:13px;opacity:.92}.ph-box .band b{display:block;font-size:24px;font-weight:800;opacity:1}
.ph-box .lg{background:#fff;border-radius:12px;padding:6px 12px;display:grid;place-items:center;min-width:100px;height:58px}
.ph-box .lg img{max-height:44px;max-width:120px;width:auto;mix-blend-mode:multiply}
.p-num-box{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f2f7ff;border:1.5px dashed var(--pc,#2a80f5);border-radius:12px;padding:12px 14px;margin:10px 0 4px}
.p-num-box small{display:block;font-size:12.5px;color:var(--mut)}.p-num-box b{font-size:clamp(18px,5.5vw,23px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.p-num-box .cp{background:var(--pc,#2a80f5);color:#fff}
ol.p-steps{list-style:none;counter-reset:s;display:grid;gap:8px;margin:12px 0}
ol.p-steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
ol.p-steps li::before{content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;background:var(--pc,#2a80f5);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;margin-top:1px}
.cf-btn{width:100%;min-height:52px;border-radius:13px;background:var(--pc,#2a80f5);color:#fff;font-size:17.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer}
.qrbox{display:grid;place-items:center;padding:12px 0}.qrbox img{width:180px;height:auto;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;mix-blend-mode:multiply}
.rc-card{margin:14px 0;border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:#fff}
.rc-card div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #dbe4f3;font-size:14.5px}.rc-card div:last-child{border:0}.rc-card span{color:var(--mut)}.rc-card b{text-align:right;word-break:break-all}
.lk-btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font-weight:700;margin-top:10px;width:100%;text-decoration:none;font-size:15px}
.lk-btn.wa{background:#25d366;color:#fff}.lk-btn.ol{border:1.5px solid #2a80f5;color:#2a80f5;background:#fff}
.bottom,.drawer,.ov{display:none}
@media(max-width:860px){
body{background:#fff}
.top,.icons a:not(.cb){display:none}
.icons{margin-left:auto}
header{flex-wrap:wrap;gap:8px 10px;padding:10px 14px;border:0}
.menu{display:block;order:0;color:var(--navy)}
.logo{order:1}.logo img{height:52px}
.icons{order:2}.search{order:3;flex-basis:100%;max-width:none;padding:6px 6px 6px 16px}
.maddr{order:4;display:flex;gap:6px;font-size:13.5px;font-weight:500;color:#333;flex-basis:100%;align-items:flex-start}.maddr svg{color:var(--navy);margin-top:2px}
.header-gap{display:none}
nav.main{display:none}
.hero{min-height:0}.slide>img{height:150px;object-fit:cover;object-position:35% 50%}.s2{aspect-ratio:auto;height:150px}.s2 img{height:80%}
.dots{position:static;margin:8px 0 0}
.cats{grid-template-columns:repeat(3,1fr);gap:14px 6px;padding:14px 10px}
.cat img{width:78px}
.about{grid-template-columns:1fr;margin:6px 12px 0}.about h2{font-size:25px}.about img{max-height:190px}
.about .t{padding:14px}
.sec{font-size:22px;margin:20px 0 10px}.sec::before,.sec::after{width:30px}
.prods{grid-template-columns:repeat(2,1fr);padding:0 12px 18px;gap:10px}
.trust{grid-template-columns:1fr 1fr;gap:12px 0}.trust div{justify-content:flex-start;padding-left:14px}.trust div:nth-child(3){border-left:0}
footer{grid-template-columns:1fr;padding-bottom:20px}
.pg{padding:14px 12px}
.det,.two{grid-template-columns:1fr}.f2{grid-template-columns:1fr}
.wrap{padding-bottom:70px}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 -4px 14px #0001}
.bottom a{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;color:var(--mut);position:relative;min-width:56px}.bottom a.on{color:var(--pink)}
.bottom .bd{top:-4px;right:6px}
.ov{display:block;position:fixed;inset:0;background:#0007;z-index:50;opacity:0;pointer-events:none;transition:.25s}.ov.show{opacity:1;pointer-events:auto}
.drawer{display:block;position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:#fff;z-index:51;transform:translateX(-100%);transition:.28s;overflow:auto}
.drawer.show{transform:none}
.drawer .h{background:var(--navy);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
.drawer a{display:block;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600}.drawer a.on{color:var(--pink)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- Payment Page Exact CSS --- */
:root{--pc:#2a80f5}
.mh{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.mt{display:flex;align-items:center;gap:12px}
.mt img{height:56px;width:auto;max-width:46%;mix-blend-mode:multiply;flex-shrink:0}
.mt h1{font-family:"Hind Siliguri","Anek Bangla",sans-serif;font-size:clamp(21px,6vw,27px);line-height:1.2;font-weight:700;margin-left:auto;text-align:right}
.mm{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed #cfdcf0}
.mm small{display:block;font-size:12.5px;color:var(--mut)}
.mm b{display:block;white-space:nowrap;font-size:clamp(16px,5vw,21px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.cp{display:inline-flex;align-items:center;gap:6px;color:#2a80f5;font-weight:600;font-size:14px;padding:9px 12px;border-radius:10px;background:#eaf2ff;min-height:40px;cursor:pointer}
.mm{align-items:center;justify-content:flex-start!important;gap:12px}.mx{min-width:0}.mx small{display:block;font-size:12.5px;color:var(--mut);margin-bottom:1px}
.ml{display:flex;align-items:center;gap:8px;flex-shrink:0}.ml small{font-size:12.5px;color:var(--mut);text-align:right}.pb{width:70px;height:70px;flex-shrink:0;border:2px solid #0b1d4a;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}.pb img{width:50px;height:auto;mix-blend-mode:multiply}
@media(max-width:360px){.mm b{font-size:15px;letter-spacing:.4px}.mx small{font-size:11.5px}.pb{width:58px;height:58px}.pb img{width:42px}.mm{gap:10px!important}}
.sum{background:#eef4fd;border-radius:14px;padding:18px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum small{display:block;color:var(--mut);font-size:14px;margin-bottom:2px}
.amt{display:flex;align-items:center;gap:10px;font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.5px;line-height:1.1}
.qr{display:flex;align-items:center;justify-content:center;min-width:0;height:62px;padding:6px 14px;border:1px solid #c6d6ee;border-radius:10px;background:#f5f9ff;color:#8190ae;font-size:15px;font-weight:500;cursor:pointer}
.qr img{height:48px;mix-blend-mode:multiply}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{position:relative;height:104px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fcfdff,#f5f9ff);display:flex;align-items:center;justify-content:center;padding-bottom:10px;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.m:hover{border-color:#a9c4ea}.m.on{border:2px solid #2a80f5;box-shadow:0 0 0 3px #2a80f526}
.m img{mix-blend-mode:multiply;max-width:84%;height:auto}
.ch{position:absolute;right:12px;bottom:10px}
.pay{margin-top:16px;width:100%;min-height:54px;border-radius:13px;background:linear-gradient(180deg,#2d8af8,#1d73ef);color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 16px #1d73ef33;cursor:pointer}
.pay:active{transform:scale(.99)}
.pw{text-align:center;margin-top:22px;color:#7787a5;font-size:13.5px;display:flex;gap:8px;justify-content:center;align-items:baseline}
.pw b{font-size:20px;font-weight:800;color:#0b1d4a}.pw b span{color:#16a34a}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;min-height:40px;margin-bottom:6px;cursor:pointer}
.ph{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ph .band{background:var(--pc);padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.ph .band div{font-size:13px;opacity:.92}.ph .band b{display:block;font-size:26px;font-weight:800;opacity:1}
.ph .lg{background:#fff;border-radius:12px;padding:8px 12px;display:grid;place-items:center;min-width:110px;height:64px}
.ph .lg img{max-height:48px;max-width:130px;width:auto;mix-blend-mode:multiply}
.bx{padding:16px}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f2f7ff;border:1.5px dashed var(--pc);border-radius:12px;padding:12px 14px;margin:10px 0 4px}
.num small{display:block;font-size:12.5px;color:var(--mut)}.num b{font-size:clamp(19px,6vw,24px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.num .cp{background:var(--pc);color:#fff}
ol.st{list-style:none;counter-reset:s;display:grid;gap:10px}
ol.st li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
ol.st li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.code{background:#eef2fa;border-radius:6px;padding:1px 8px;font-weight:700;font-family:Inter,monospace}
.fg{display:grid;gap:12px}
.fg label{font-size:14px;font-weight:600;display:grid;gap:5px}
.in{width:100%;border:1.5px solid #cfd9ec;border-radius:11px;padding:0 14px;height:50px;font-size:16px;background:#fff}
.in:focus{border-color:var(--pc);outline:0;box-shadow:0 0 0 3px #2a80f51f}
.hint{font-size:12.5px;color:var(--mut);font-weight:400}
.err{color:#c62828;font-size:13.5px;min-height:18px}
.cf{width:100%;min-height:54px;border-radius:13px;background:var(--pc);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer}
.cf:active{transform:scale(.99)}
.qrbox{display:grid;place-items:center;padding:14px 0}.qrbox img{width:190px;height:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;mix-blend-mode:multiply}
.ok{text-align:center;padding:24px 16px 8px}
.tick{width:72px;height:72px;border-radius:50%;background:#e4f8ec;color:#1b9e55;display:grid;place-items:center;margin:0 auto 12px}
.ok h1{font-size:23px;margin-bottom:6px}.ok p{color:var(--mut);font-size:15px}
.rc{margin:14px 0;border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:#fff}
.rc div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #dbe4f3;font-size:14.5px}.rc div:last-child{border:0}.rc span{color:var(--mut)}.rc b{text-align:right;word-break:break-all}
.lk{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;font-weight:700;margin-top:10px;width:100%}
.wa{background:#25d366;color:#fff}.ol{border:1.5px solid #2a80f5;color:#2a80f5;background:#fff}
#t{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:30px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#t.s{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.m{height:90px}.qr{padding:6px 10px}.mt img{height:46px}}

async function syncOrderToFirebase(o) {
  try {
    const firestoreDb = window.db || (typeof firebase !== 'undefined' && firebase.apps.length ? firebase.firestore() : null);
    if (firestoreDb) {
      await firestoreDb.collection('orders').doc(o.id).set(o);
      console.log("Order saved to Firestore successfully:", o.id);
      return true;
    }
  } catch (err) {
    console.warn("Firestore compat write warning:", err);
  }
  try {
    if (window.nativeDb && typeof setDoc === 'function' && typeof doc === 'function') {
      await setDoc(doc(window.nativeDb, 'orders', o.id), o);
      console.log("Order saved via nativeDb to Firestore:", o.id);
      return true;
    }
  } catch (err) {
    console.warn("NativeDb write warning:", err);
  }
}

cart:()=>{if(!cart.length)return `<div class="pg"><h1 class="t">আমার কার্ট</h1><div class="empty">${ic('cart',54)}<p>আপনার কার্ট খালি।</p><a class="btn" href="#/cat/all">কেনাকাটা শুরু করুন</a></div></div>`;return `<div class="pg"><h1 class="t">আমার কার্ট</h1><div class="two"><div>${cart.map((c,i)=>{const p=P[c.id-1];return `<div class="cr"><img src="${IMG[p.img]}" alt=""><div><a href="#/product/${p.id}"><h3>${p.n}</h3></a><small>${c.size?'সাইজ: '+c.size+' · ':''}${tk(p.pr)}</small><div class="qty" style="margin-top:6px"><button data-cq="${i}:-1">−</button><span>${bn(c.qty)}</span><button data-cq="${i}:1">+</button></div></div><div class="rt"><b>${tk(p.pr*c.qty)}</b><button class="rm" data-rm="${i}">${ic('trash',15)} মুছুন</button></div></div>`}).join('')}</div>${summary()}</div></div>`},
checkout:()=>{
  if(!cart.length){
    const p = st.get('pendingOrder');
    if(!p){location.hash='#/cart';route();return'';}
  }
  const u=user||{},s=cart.length?cart.reduce((a,c)=>a+getProd(c.id).pr*c.qty,0):(st.get('pendingOrder')?.subtotal||0),d=ship(s);
  return `<div class="pg"><h1 class="t">চেকআউট</h1><form id="co" class="two" novalidate><div class="box fg"><h3>ডেলিভারি তথ্য</h3><div class="err" id="co-err" style="display:none;margin-bottom:12px;padding:10px 14px;background:#fde8e8;border:1px solid #f8b4b4;border-radius:8px;color:#c81e1e;font-size:14px;font-weight:600"></div><div class="f2"><label>আপনার নাম <span style="color:var(--pink)">*</span><input class="in" name="name" id="co-name" required value="${u.name||''}" placeholder="আপনার নাম লিখুন"></label><label>মোবাইল নম্বর <span style="color:var(--pink)">*</span><input class="in" name="phone" id="co-phone" required inputmode="numeric" placeholder="01XXXXXXXXX" value="${u.phone||''}"></label></div><label>সম্পূর্ণ ঠিকানা <span style="color:var(--pink)">*</span><textarea class="in" name="addr" id="co-addr" rows="3" required placeholder="বাড়ি/রোড নম্বর, এলাকা, থানা/উপজেলা লিখুন">${u.addr||''}</textarea></label><label>জেলা <span style="color:var(--pink)">*</span><input class="in" name="dist" id="co-dist" required value="${u.dist||'শরীয়তপুর'}"></label><h3 style="margin-top:12px">পেমেন্ট পদ্ধতি নির্বাচন করুন</h3><div class="pay" id="pay-select" style="display:grid;gap:10px;margin-top:6px"><label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer"><input type="radio" name="pay" value="cod" checked style="width:18px;height:18px"> <span><b>ক্যাশ অন ডেলিভারি</b> (ডেলিভারি চার্জ ৳ ${bn(d)} অগ্রিম পেমেন্ট)</span></label><label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer"><input type="radio" name="pay" value="paynow" style="width:18px;height:18px"> <span><b>অনলাইন পেমেন্ট / পে নাও</b> (ফুল পেমেন্ট ৳ ${bn(s+d)})</span></label></div><div id="pay-note" class="box" style="background:#eef4fd;border:1px solid #c6d6ee;margin-top:10px;padding:12px"><b id="note-title" style="color:var(--navy);display:block;font-size:15px">অ্যাডভান্স ফর ডেলিভারি চার্জ</b><p id="note-desc" style="font-size:13.5px;color:var(--mut);margin-top:4px">ডেলিভারি চার্জ ৳ ${bn(d)} অগ্রিম পেমেন্ট করতে হবে। অর্ডার কনফার্মের পর অবশিষ্ট ৳ ${bn(s)} ক্যাশ অন ডেলিভারিতে পরিশোধ করবেন।</p></div></div>${summary(true)}</form></div>`;
},
payment: a => {
  const p = st.get('pendingOrder');
  const s = p ? p.subtotal : cart.reduce((acc, c) => acc + getProd(c.id).pr * c.qty, 0);
  const d = p ? p.ship : ship(s);
  const isFull = p ? (p.payMethod === 'অনলাইন পেমেন্ট (ফুল)') : false;
  const payAmount = isFull ? (s + d) : (d || 60);

  const selKey = a[0] || '';

  if (!selKey) {
    return `<div class="pg" style="max-width:520px;margin:0 auto;padding-top:10px">
      <header class="mh">
        <div class="mt"><img src="${IMG_PAY.fp_logo}" alt="ফ্যাশন point"><h1>ফ্যাশন point</h1></div>
        <div class="mm">
          <span class="pb"><img src="${IMG_PAY.paybd}" alt="PayBD"></span>
          <div class="mx"><small>Merchant Account</small><b id="mid">${fmt(CFG.merchantId)}</b></div>
          <button class="cp" style="margin-left:auto" data-cpm>${CP} কপি</button>
        </div>
      </header>
      <div class="sum">
        <div><small>You are paying</small><div class="amt"><span id="amt">৳${payAmount.toFixed(2)}</span></div></div>
        <button class="qr" data-go="qr" aria-label="Pay with Bangla QR"><img src="${IMG_PAY.qr}" alt="Bangla QR"></button>
      </div>
      <h2>Pay with Mobile Banking</h2>
      <div class="g">
        ${Object.keys(M).map(k => `<button class="m ${selPayMethod==k?'on':''}" data-k="${k}" aria-label="${M[k].n}"><img src="${IMG_PAY[k]}" alt="${M[k].n}">${selPayMethod==k?CHECK_SVG:''}</button>`).join('')}
      </div>
      <button class="pay" id="pay-btn">Pay ৳${payAmount.toFixed(2)}</button>
      <div class="pw">Secured by <img src="${IMG_PAY.paybd}" style="height:20px;mix-blend-mode:multiply" alt="PayBD"> <b>Pay<span>BD</span></b></div>
    </div>`;
  }

  if (selKey === 'qr') {
    return `<div class="pg" style="max-width:520px;margin:0 auto;padding-top:10px">
      <button class="back" data-go="home">← পেছনে যান</button>
      <div class="ph">
        <div class="band" style="background:#16793a">
          <div>পরিশোধযোগ্য টাকা<b>৳${payAmount.toFixed(2)}</b></div>
          <div class="lg"><img src="${IMG_PAY.qr}" alt="Bangla QR"></div>
        </div>
        <div class="bx">
          <div class="qrbox"><img src="${IMG_PAY.qr}" alt="Bangla QR কোড"></div>
          <ol class="st" style="--pc:#16793a">
            <li><span>মোবাইল ব্যাংকিং অ্যাপে <b>Scan QR</b> খুলুন</span></li>
            <li><span>QR স্ক্যান করে <b>৳${payAmount.toFixed(2)}</b> কনফার্ম করুন</span></li>
            <li><span>রিসিপ্টের <b>TrxID</b> কপি করে নিচে বসান</span></li>
          </ol>
          ${formPay('qr')}
        </div>
      </div>
    </div>`;
  }

  const m = M[selKey];
  if (!m) return T.payment([]);

  return `<div class="pg" style="max-width:520px;margin:0 auto;padding-top:10px">
    <button class="back" data-go="home">← পেছনে যান</button>
    <div class="ph" style="--pc:${m.c}">
      <div class="band">
        <div>পরিশোধযোগ্য টাকা<b>৳${payAmount.toFixed(2)}</b></div>
        <div class="lg"><img src="${IMG_PAY[selKey]}" alt="${m.n}"></div>
      </div>
      <div class="bx">
        <div class="num">
          <div><small>${m.n} নম্বর (Send Money করুন)</small><b>${CFG.wallets[selKey]}</b></div>
          <button class="cp" data-copy="${CFG.wallets[selKey]}">${CP} কপি</button>
        </div>
        ${steps(selKey, payAmount, p?p.name:'')}
        ${formPay(selKey)}
      </div>
    </div>
  </div>`;
},
'payment-done': () => {
  const o = orders[0] || st.get('lastOrder', null);
  if (!o) { location.hash = '#/'; route(); return ''; }
  const wm = encodeURIComponent(`পেমেন্ট কনফার্মেশন\nমার্চেন্ট: ফ্যাশন পয়েন্ট (${fmt(CFG.merchantId)})\nমাধ্যম: ${o.payMethod}\nটাকা: ৳${o.paidAmount}\nTrxID: ${o.trxId||'-'}\nপ্রেরকের নম্বর: ${o.senderPhone||'-'}`);

  return `<div class="pg" style="max-width:520px;margin:0 auto;padding-top:10px">
    <div class="ok">
      <div class="tick"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h1>পেমেন্ট তথ্য জমা হয়েছে</h1>
      <p>আমরা TrxID যাচাই করে আপনার অর্ডার নিশ্চিত করব।</p>

    <div class="rc">
      <div><span>মার্চেন্ট</span><b>ফ্যাশন পয়েন্ট</b></div>
      <div><span>মাধ্যম</span><b>${o.payMethod}</b></div>
      <div><span>টাকা</span><b>৳${o.paidAmount}</b></div>
      <div><span>TrxID</span><b>${o.trxId||'-'}</b></div>
      <div><span>প্রেরকের নম্বর</span><b>${o.senderPhone||'-'}</b></div>
      <div><span>সময়</span><b>${o.date}</b></div>

    <a class="lk wa" target="_blank" rel="noopener" href="https://wa.me/${CFG.wa}?text=${wm}">WhatsApp-এ নিশ্চিত করুন</a>
    <a class="lk ol" href="#/">হোমে ফিরুন</a>
  </div>`;
},
qr: () => T.payment(['qr']),
order:a=>{const o=orders.find(x=>x.id==a[0])||st.get('lastOrder',null);if(!o)return T.nf();const msg=encodeURIComponent(`অর্ডার #${o.id}\nনাম: ${o.name}\nফোন: ${o.phone}\nঠিকানা: ${o.addr}, ${o.dist}\nপেমেন্ট: ${o.payMethod||'ক্যাশ অন ডেলিভারি'}\n`+o.items.map(i=>`${getProd(i.id).n} ${i.size||''} x${i.qty}`).join('\n')+`\nমোট: ${tk(o.total)} টাকা`);return `<div class="pg narrow"><div class="ok"><div class="tick">${ic('ok',36)}</div><h1 class="t">অর্ডার সফলভাবে সম্পন্ন হয়েছে!</h1><p>অর্ডার নম্বর: <b>#${bn(o.id)}</b></p><p style="color:var(--mut)">আমরা শীঘ্রই ${bn(o.phone)} নম্বরে যোগাযোগ করব।</p></div><div class="box">${o.items.map(i=>`<div class="row"><span>${getProd(i.id).n} × ${bn(i.qty)}</span><span>${tk(getProd(i.id).pr*i.qty)}</span></div>`).join('')}<div class="row"><span>ডেলিভারি চার্জ</span><span>${o.ship?tk(o.ship):'ফ্রি'}</span></div><div class="row t"><span>মোট</span><span>${tk(o.total)}</span></div>${o.paidAmount?`<div class="row"><span>পরিশোধিত (অগ্রিম)</span><span>${tk(o.paidAmount)}</span></div><div class="row" style="color:var(--pink)"><b>অবশিষ্ট ক্যাশ অন ডেলিভারি</b><b>${tk(o.dueAmount)}</b></div>`:''}</div><div class="acts" style="justify-content:center;margin-top:14px"><a class="btn" style="background:#25d366" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${msg}">WhatsApp-এ নিশ্চিত করুন</a><a class="btn o" href="#/">হোমে ফিরুন</a></div></div>`},
account:()=>{if(user)return `<div class="pg narrow"><h1 class="t">আমার অ্যাকাউন্ট</h1><div class="box"><p><b>${user.name}</b></p><p style="color:var(--mut)">${bn(user.phone)}</p><button class="btn n" data-out>লগআউট</button></div><h3 style="margin:18px 0 8px;color:var(--navy)">আমার অর্ডার</h3>${orders.filter(o=>o.phone==user.phone).map(o=>`<a class="box" style="display:block;margin-bottom:8px" href="#/order/${o.id}"><div class="row"><b>#${bn(o.id)}</b><span class="tag">${o.status}</span></div><div class="row"><span>${bn(o.date)}</span><b>${tk(o.total)}</b></div></a>`).join('')||'<div class="empty">কোনো অর্ডার নেই।</div>'}</div>`;
return `<div class="pg narrow"><div class="tabs"><button class="on" data-tab="l">লগইন</button><button data-tab="r">রেজিস্টার</button></div><form id="au" class="fg" data-m="l"><label id="nm" hidden>আপনার নাম<input class="in" name="name"></label><label>মোবাইল নম্বর<input class="in" name="phone" required pattern="01[3-9][0-9]{8}" inputmode="numeric" placeholder="01XXXXXXXXX"></label><label>পাসওয়ার্ড<input class="in" type="password" name="pass" required minlength="4"></label><div class="err" id="er"></div><button class="btn" style="justify-content:center;margin:0">লগইন করুন</button></form></div>`},
about:()=>`<div class="pg"><h1 class="t">আমাদের সম্পর্কে</h1><section class="about" style="margin:10px 0"><div class="t"><h2>ফ্যাশন <span>পয়েন্ট</span></h2><p>সবার জন্য ফ্যাশন, সবসময় ফ্যাশন পয়েন্ট। আমাদের শোরুমে ০–১০ বছর বয়সী শিশুদের আকর্ষণীয় পোশাকসহ নারী ও পুরুষদের শার্ট, প্যান্ট, থ্রি-পিস, ওড়না, গজ কাপড় ও থান কাপড় পাইকারি ও খুচরা মূল্যে পাওয়া যায়।</p><p style="margin-top:8px">আমরা সারা দেশে ডেলিভারি দিই এবং বিকাশ, নগদ ও রকেটে নিরাপদ লেনদেনের সুবিধা রাখি।</p><a class="btn" href="#/contact">যোগাযোগ করুন</a></div><img src="${IMG.about}" alt=""></section></div>`,
contact:()=>`<div class="pg"><h1 class="t">যোগাযোগ</h1><div class="two"><div class="box fg"><h3>বার্তা পাঠান</h3><form id="ct" class="fg"><label>নাম<input class="in" name="name" required></label><label>মোবাইল<input class="in" name="phone" required></label><label>বার্তা<textarea class="in" name="msg" rows="4" required></textarea></label><button class="btn" style="justify-content:center;margin:0">WhatsApp-এ পাঠান</button></form></div><div class="box"><h3>আমাদের ঠিকানা</h3><p style="display:flex;gap:8px">${ic('pin',20)} ${ADDR}</p><p style="margin-top:8px"><a href="https://wa.me/${WA}" target="_blank" rel="noopener"><b>হোয়াটসঅ্যাপ নম্বর:</b> ${bn('01615607928')}</a></p><p><a href="tel:${TEL}"><b>কন্টাক্ট নম্বর:</b> ${bn(TEL)}</a></p><a class="btn" style="margin-top:10px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent('বালারহাট সখিপুর শরীয়তপুর')}">ম্যাপে দেখুন</a></div></div></div>`,
nf:()=>`<div class="pg"><div class="empty"><p>পেজটি পাওয়া যায়নি।</p><a class="btn" href="#/">হোমে ফিরুন</a></div></div>`};
function listing(title,l,chips){return `<div class="pg"><div class="crumb"><a href="#/">হোম</a> / ${title}</div><h1 class="t">${title}</h1><div class="bar">${chips||'<span></span>'}<select id="srt" aria-label="সাজান"><option value="def">ডিফল্ট</option><option value="lo" ${sortBy=='lo'?'selected':''}>দাম: কম থেকে বেশি</option><option value="hi" ${sortBy=='hi'?'selected':''}>দাম: বেশি থেকে কম</option></select></div>${l.length?`<section class="prods">${l.map(card).join('')}</section>`:`<div class="empty">${ic('search',54)}<p>কোনো পণ্য পাওয়া যায়নি।</p></div>`}</div>`}
const ship=s=>s>=1000||!s?0:60;

const foot=`<div class="trust-slot"></div><footer><div><img src="${IMG.flogo}" alt="ফ্যাশন point"><p>সবার জন্য ফ্যাশন, সবসময় ফ্যাশন পয়েন্ট</p></div><div><h4>দ্রুত লিংক</h4><ul>${NAV.slice(0,2).concat([['নারীদের পোশাক','#/cat/women'],['পুরুষদের পোশাক','#/cat/men'],['থ্রি-পিস','#/cat/three'],['ওড়না','#/cat/orna'],['গজ কাপড়','#/cat/gaj'],['থান কাপড়','#/cat/than'],['সব পণ্য','#/cat/all'],['আমাদের সম্পর্কে','#/about'],['যোগাযোগ','#/contact']]).map(n=>`<li><a href="${n[1]}">${n[0]}</a></li>`).join('')}</ul></div><div><h4>যোগাযোগ</h4><p>${ic('pin',16)}<span>${ADDR}</span></p><p>${ic('phone',16)}<a href="https://wa.me/${WA}">হোয়াটসঅ্যাপ নম্বর: ${bn('01615607928')}</a></p><p>${ic('phone',16)}<a href="tel:${TEL}">কন্টাক্ট নম্বর: ${bn(TEL)}</a></p></div><div><h4>আমাদের সাথে থাকুন</h4><div class="soc"><a href="https://facebook.com" target="_blank" rel="noopener" style="background:#1877f2" aria-label="Facebook">f</a><a href="https://youtube.com" target="_blank" rel="noopener" style="background:#f00" aria-label="YouTube">▶</a><a href="https://tiktok.com" target="_blank" rel="noopener" style="background:#111" aria-label="TikTok">♪</a><a href="https://instagram.com" target="_blank" rel="noopener" style="background:linear-gradient(45deg,#f9a03f,#d6249f,#285aeb)" aria-label="Instagram">◎</a></div><div class="sig">ফ্যাশন পয়েন্ট,<br><b>সবসময় আপনার সাথে!</b></div></div><div class="copy">© 2025 Fashion Point. All Rights Reserved. &nbsp; ♥ Style for Everyone</div></footer>`;

function route(){const h=location.hash.replace(/^#\/?/,''),[k,...a]=h.split('/'),f=T[k]||T.nf;$('#app').innerHTML=f(a);window.scrollTo(0,0);upd();
document.querySelectorAll('nav.main a').forEach((x,i)=>x.classList.toggle('on',x.getAttribute('href')=='#/'+h||(i==0&&!h)));
document.querySelectorAll('.bottom a').forEach(x=>x.classList.toggle('on',x.dataset.b==k||(k=='checkout'&&x.dataset.b=='cart')||(k=='payment'&&x.dataset.b=='cart')));
clearInterval(slideT);if($('#trk')){slideI=0;slideT=setInterval(()=>go(slideI+1),4500)}}
function go(i){const t=$('#trk');if(!t)return;slideI=(i+SL.length)%SL.length;t.style.transform=`translateX(-${slideI*100}%)`;document.querySelectorAll('[data-sl]').forEach((d,j)=>d.classList.toggle('on',j==slideI))}

let isSubmittingOrder = false;

document.addEventListener('change', e => {
  if(e.target && e.target.name === 'pay') {
    const isPaynow = e.target.value === 'paynow';
    const s = cart.reduce((a,c)=>a+getProd(c.id).pr*c.qty,0), d = ship(s);
    const title = $('#note-title'), desc = $('#note-desc');
    if(title && desc) {
      if(isPaynow) {
        title.textContent = 'অনলাইন পেমেন্ট / পে নাও (ফুল পেমেন্ট)';
        desc.textContent = `পণ্যের মোট মূল্য ৳ ${bn(s)} + ডেলিভারি চার্জ ৳ ${bn(d)} = সর্বমোট ৳ ${bn(s+d)} অনলাইন পেমেন্ট পেজে পরিশোধ করতে হবে।`;
      } else {
        title.textContent = 'অ্যাডভান্স ফর ডেলিভারি চার্জ';
        desc.textContent = `ডেলিভারি চার্জ ৳ ${bn(d)} অগ্রিম পেমেন্ট করতে হবে। অর্ডার কনফার্মের পর অবশিষ্ট ৳ ${bn(s)} ক্যাশ অন ডেলিভারিতে পরিশোধ করবেন।`;
      }
    }
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('button,a,[data-menu],[data-copy-num],[data-k],[data-go],[data-copy],[data-cpm],#pay-btn,.m');
  if(!t) return;
  const d = t.dataset;

  if (t.classList.contains('m') || t.closest('.m')) {
    const card = t.classList.contains('m') ? t : t.closest('.m');
    const k = card.dataset.k;
    selPayMethod = k;
    document.querySelectorAll('.m').forEach(b => b.classList.toggle('on', b.dataset.k == k));
    return;
  }

  if (t.id == 'pay-btn' || t.closest('#pay-btn')) {
    if (selPayMethod) {
      location.hash = '#/payment/' + selPayMethod;
      route();
    } else {
      toast('একটি পেমেন্ট মাধ্যম বেছে নিন');
    }
    return;
  }

  if (d.go === 'qr' || t.closest('[data-go="qr"]')) {
    selPayMethod = 'qr';
    location.hash = '#/payment/qr';
    route();
    return;
  }

  if (d.go === 'home' || t.closest('[data-go="home"]')) {
    selPayMethod = 'bkash';
    location.hash = '#/payment';
    route();
    return;
  }

  if (d.cpm !== undefined || t.closest('[data-cpm]')) {
    copyText(CFG.merchantId, 'মার্চেন্ট নম্বর কপি হয়েছে');
    return;
  }

  if (d.copy) {
    copyText(d.copy, 'নম্বর কপি হয়েছে');
    return;
  }

  if(t.type=='submit'||t.getAttribute('type')=='submit'||t.id=='co-submit-btn'||t.id=='pf-submit-btn'||t.id=='cf-submit-btn'){
    const f=t.closest('form');
    if(f){e.preventDefault();processSubmit(f);return}
  }
  if(d.copyNum){copyText(d.copyNum,'নম্বর কপি হয়েছে')}
  if((d.menu!==undefined&&t.tagName!='A')||(t.tagName=='A'&&d.menu!==undefined)){$('#dr').classList.toggle('show');document.querySelector('.ov').classList.toggle('show')}
  if(d.a){addCart(+d.a)}
  if(d.ad){addCart(+d.ad,sel.qty,sel.size)}
  if(d.buy){addCart(+d.buy,sel.qty,sel.size);location.hash='#/checkout';route()}
  if(d.w){const i=+d.w;wish.includes(i)?wish=wish.filter(x=>x!=i):wish.push(i);save();upd();toast(wish.includes(i)?'পছন্দের তালিকায় যোগ হয়েছে':'তালিকা থেকে সরানো হয়েছে');if(location.hash.startsWith('#/wishlist'))route();else document.querySelectorAll(`[data-w="${i}"].hb`).forEach(b=>b.classList.toggle('on',wish.includes(i)))}
  if(d.sl!==undefined){go(+d.sl);clearInterval(slideT)}
  if(d.sz){sel.size=d.sz;document.querySelectorAll('[data-sz]').forEach(b=>b.classList.toggle('on',b.dataset.sz==sel.size))}
  if(d.sq){sel.qty=Math.max(1,sel.qty+ +d.sq);$('#sq').textContent=bn(sel.qty)}
  if(d.cq){const[i,v]=d.cq.split(':');cart[i].qty=Math.max(1,cart[i].qty+ +v);save();route()}
  if(d.rm!==undefined){cart.splice(+d.rm,1);save();route()}
  if(d.allcart!==undefined){wish.forEach(i=>addCart(i));route()}
  if(d.out!==undefined){user=null;save();shell();route();toast('লগআউট হয়েছে')}
  if(d.tab){const r=d.tab=='r';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b==t));$('#nm').hidden=!r;$('#au').dataset.m=d.tab;$('#au button.btn').textContent=r?'রেজিস্টার করুন':'লগইন করুন';$('#er').textContent=''}
});
function processSubmit(f){
  if(!f)return;
  const v=Object.fromEntries(new FormData(f));
  if(f.id=='sf'){const q=v.q||$('#q').value.trim();if(q){location.hash='#/search/'+encodeURIComponent(q);route()}}
  if(f.id=='co'){
    const errBox1=$('#co-err'),errBox2=$('#co-err2');
    const showCoErr=msg=>{if(errBox1){errBox1.textContent=msg;errBox1.style.display='block'}if(errBox2){errBox2.textContent=msg;errBox2.style.display='block'}toast(msg)};
    if(errBox1)errBox1.style.display='none';
    if(errBox2)errBox2.style.display='none';

    if(!v.name||!v.name.trim()){showCoErr('অনুগ্রহ করে আপনার নাম লিখুন');$('#co-name')?.focus();return}
    let ph=(v.phone||'').replace(/\D/g,'');
    if(ph.length===13&&ph.startsWith('8801'))ph=ph.slice(2);
    else if(ph.length===12&&ph.startsWith('880'))ph=ph.slice(2);
    else if(ph.length===10&&ph.startsWith('1'))ph='0'+ph;
    if(!/^01[3-9]\d{8}$/.test(ph)){showCoErr('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন: 01712345678)');$('#co-phone')?.focus();return}
    if(!v.addr||!v.addr.trim()){showCoErr('অনুগ্রহ করে সম্পূর্ণ ঠিকানা লিখুন');$('#co-addr')?.focus();return}

    const s=cart.reduce((a,c)=>a+getProd(c.id).pr*c.qty,0),d=ship(s);
    const payMode = v.pay === 'paynow' ? 'অনলাইন পেমেন্ট (ফুল)' : 'ডেলিভারি চার্জ (অগ্রিম)';
    
    const pending = {
      name: v.name.trim(),
      phone: ph,
      addr: v.addr.trim(),
      dist: (v.dist||'শরীয়তপুর').trim(),
      subtotal: s,
      ship: d,
      payMethod: payMode,
      items: cart.slice()
    };
    st.set('pendingOrder', pending);
    pendingOrder = pending;
    
    user = { name: pending.name, phone: pending.phone, addr: pending.addr, dist: pending.dist };
    save();
    
    location.hash = '#/payment';
    route();
    toast('পেমেন্ট পেজে রিডাইরেক্ট করা হচ্ছে...');
  }
  if(f.id=='pf' || f.id=='f'){
    const errBox=$('#pf-err') || $('#er');
    const showPfErr=msg=>{if(errBox){errBox.textContent=msg;errBox.style.display='block'}toast(msg)};
    if(errBox)errBox.style.display='none';

    let senderPh=(f.s?f.s.value:(f.sender?f.sender.value:'')).replace(/\D/g,'');
    if(senderPh.length===13&&senderPh.startsWith('8801'))senderPh=senderPh.slice(2);
    else if(senderPh.length===12&&senderPh.startsWith('880'))senderPh=senderPh.slice(2);
    else if(senderPh.length===10&&senderPh.startsWith('1'))senderPh='0'+senderPh;

    if(!/^01[3-9]\d{8}$/.test(senderPh)){showPfErr('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন');(f.s||f.sender)?.focus();return}
    const trxId = (f.t?f.t.value:(f.trx?f.trx.value:'')).trim().toUpperCase();
    if(!trxId || trxId.length < 8 || trxId.length > 14 || !/^[A-Z0-9]+$/.test(trxId)){showPfErr('Transaction ID ৮ থেকে ১০ অক্ষরের হতে হবে (ইংরেজি বড় হাতের অক্ষর ও সংখ্যা)');(f.t||f.trx)?.focus();return}

    if(junk(trxId)){showPfErr('এটি সঠিক Transaction ID নয়। রিসিপ্ট বা SMS থেকে হুবহু কপি করুন');(f.t||f.trx)?.focus();return}

    const usedTrx = st.get('trx', []);
    if(usedTrx.some(x=>x.t==trxId)){showPfErr('এই Transaction ID আগেই ব্যবহার হয়েছে। একই ID দ্বিতীয়বার গ্রহণযোগ্য নয়');(f.t||f.trx)?.focus();return}

    if(isSubmittingOrder)return;
    isSubmittingOrder=true;
    const submitBtn=$('#pf-submit-btn') || f.querySelector('button[type=submit]');
    if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='পেমেন্ট প্রসেস হচ্ছে...'}

    const p = st.get('pendingOrder') || {};
    const sVal = p.subtotal || cart.reduce((a,c)=>a+getProd(c.id).pr*c.qty,0);
    const dVal = p.ship !== undefined ? p.ship : ship(sVal);
    const isFull = p.payMethod === 'অনলাইন পেমেন্ট (ফুল)';
    const paid = isFull ? (sVal + dVal) : (dVal || 60);
    const due = (sVal + dVal) - paid;
    const walletName = (f.wallet?f.wallet.value:'') || (M[selPayMethod]?M[selPayMethod].n:'মোবাইল ব্যাংকিং');

    const verifyPay = async () => {
      try {
        const res = await fetch('/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            trx: trxId,
            amount: paid,
            phone: senderPh,
            method: walletName,
            ref: p.name || 'Order'
          })
        });
        const resData = await res.json();
        if (!resData.ok) {
          isSubmittingOrder = false;
          if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'পেমেন্ট কনফার্ম করুন'; }
          showPfErr(resData.msg || 'Transaction ID ভেরিফাই করা যায়নি');
          return false;
        }
        return true;
      } catch (err) {
        console.warn('Verify API fallback:', err);
        return true;
      }
    };

    verifyPay().then(ok => {
      if (!ok) return;

      const dateStr = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const o = {
        id: String(Date.now()).slice(-7),
        items: p.items && p.items.length ? p.items : cart.slice(),
        subtotal: sVal,
        ship: dVal,
        total: sVal + dVal,
        paidAmount: paid,
        dueAmount: due,
        payReason: isFull ? 'ফুল পেমেন্ট (অনলাইন)' : 'ডেলিভারি চার্জ (অগ্রিম)',
        payMethod: walletName,
        senderPhone: senderPh,
        trxId: trxId,
        name: p.name || (user?user.name:'গ্রাহক'),
        phone: p.phone || (user?user.phone:''),
        addr: p.addr || '',
        dist: p.dist || 'শরীয়তপুর',
        status: 'পেমেন্ট পর্যালোচনায়',
        date: dateStr
      };

      usedTrx.unshift({ t: trxId, s: senderPh, a: paid, m: walletName, d: dateStr });
      st.set('trx', usedTrx);

      orders.unshift(o);
      st.set('lastOrder', o);
      save();

      syncOrderToFirebase(o);

      cart = [];
      st.set('pendingOrder', null);
      save();

      isSubmittingOrder = false;
      location.hash = '#/payment-done';
      route();
    });
  }
  if(f.id=='ct'){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(v.msg+'\n— '+v.name+', '+v.phone)}`,'_blank','noopener')}
  if(f.id=='au'){const us=st.get('users',{}),er=$('#er');if(f.dataset.m=='r'){if(!v.name){er.textContent='নাম লিখুন';return}if(us[v.phone]){er.textContent='এই নম্বরে আগেই অ্যাকাউন্ট আছে';return}us[v.phone]={name:v.name,phone:v.phone,pass:btoa(unescape(encodeURIComponent(v.pass)))};st.set('users',us);user={name:v.name,phone:v.phone}}else{const u=us[v.phone];if(!u||u.pass!=btoa(unescape(encodeURIComponent(v.pass)))){er.textContent='মোবাইল নম্বর বা পাসওয়ার্ড সঠিক নয়';return}user={name:u.name,phone:u.phone}}save();shell();route();toast('স্বাগতম, '+user.name)}
}
document.addEventListener('submit',e=>{e.preventDefault();processSubmit(e.target)});
function copyText(str,msg){
  function fallback(){const el=document.createElement('input');el.value=str;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast(msg)}catch(e){toast(str)}el.remove()}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(str).then(()=>toast(msg),fallback);else fallback();
}
let pendingOrder=st.get('pendingOrder',null);
let lastOrder=st.get('lastOrder',null);
window.addEventListener('hashchange',route);
shell();route();
</script>
