<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fe">
<title>ফ্যাশন পয়েন্ট – সুরক্ষিত পেমেন্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pc:#2a80f5;--navy:#0b1d45;--mut:#6b7b9c;--line:#d9e4f4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,'Hind Siliguri',system-ui,sans-serif;background:#f6f9fe;color:var(--navy);min-height:100vh;display:flex;justify-content:center}
.pg{width:100%;max-width:520px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
[hidden]{display:none!important}
.mh{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.mt{display:flex;align-items:center;gap:12px}
.mt img{height:56px;width:auto;max-width:46%;mix-blend-mode:multiply;flex-shrink:0}
.mt h1{font-family:'Hind Siliguri',Inter,sans-serif;font-size:clamp(21px,6vw,27px);line-height:1.2;font-weight:700;margin-left:auto;text-align:right}
.mm{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed #cfdcf0}
.mm small{display:block;font-size:12.5px;color:var(--mut)}
.mm b{display:block;white-space:nowrap;font-size:clamp(16px,5vw,21px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.cp{display:inline-flex;align-items:center;gap:6px;color:#2a80f5;font-weight:600;font-size:14px;padding:9px 12px;border-radius:10px;background:#eaf2ff;min-height:40px}
.mm{align-items:center}.mm{justify-content:flex-start!important;gap:12px}.mx{min-width:0}.mx small{display:block;font-size:12.5px;color:var(--mut);margin-bottom:1px}
.ml{display:flex;align-items:center;gap:8px;flex-shrink:0}.ml small{font-size:12.5px;color:var(--mut);text-align:right}.pb{width:70px;height:70px;flex-shrink:0;border:2px solid #0b1d4a;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}.pb img{width:50px;height:auto;mix-blend-mode:multiply}
@media(max-width:360px){.mm b{font-size:15px;letter-spacing:.4px}.mx small{font-size:11.5px}.pb{width:58px;height:58px}.pb img{width:42px}.mm{gap:10px!important}}
.sum{background:#eef4fd;border-radius:14px;padding:18px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum small{display:block;color:var(--mut);font-size:14px;margin-bottom:2px}
.amt{display:flex;align-items:center;gap:10px;font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.5px;line-height:1.1}
.qr{display:flex;align-items:center;justify-content:center;min-width:0;height:62px;padding:6px 14px;border:1px solid #c6d6ee;border-radius:10px;background:#f5f9ff;color:#8190ae;font-size:15px;font-weight:500}
.qr img{height:48px;mix-blend-mode:multiply}
h2{font-size:18.5px;font-weight:600;margin:24px 2px 12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{position:relative;height:104px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#fcfdff,#f5f9ff);display:flex;align-items:center;justify-content:center;padding-bottom:10px;transition:border-color .15s,box-shadow .15s}
.m:hover{border-color:#a9c4ea}.m.on{border:2px solid #2a80f5;box-shadow:0 0 0 3px #2a80f526}
.m img{mix-blend-mode:multiply;max-width:84%;height:auto}
.ch{position:absolute;right:12px;bottom:10px}
.pay{margin-top:16px;width:100%;min-height:54px;border-radius:13px;background:linear-gradient(180deg,#2d8af8,#1d73ef);color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 16px #1d73ef33}
.pay:active{transform:scale(.99)}
.pw{text-align:center;margin-top:22px;color:#7787a5;font-size:13.5px;display:flex;gap:8px;justify-content:center;align-items:baseline}
.pw b{font-size:20px;font-weight:800;color:#0b1d4a}.pw b span{color:#16a34a}
/* detail view */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;min-height:40px;margin-bottom:6px}
.ph{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ph .band{background:var(--pc);padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}
.ph .band div{font-size:13px;opacity:.92}.ph .band b{display:block;font-size:26px;font-weight:800;opacity:1}
.ph .lg{background:#fff;border-radius:12px;padding:8px 12px;display:grid;place-items:center;min-width:110px;height:64px}
.ph .lg img{max-height:48px;max-width:130px;width:auto;mix-blend-mode:multiply}
.bx{padding:16px}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f2f7ff;border:1.5px dashed var(--pc);border-radius:12px;padding:12px 14px;margin:10px 0 4px}
.num small{display:block;font-size:12.5px;color:var(--mut)}.num b{font-size:clamp(19px,6vw,24px);letter-spacing:1px;font-variant-numeric:tabular-nums}
.num .cp{background:var(--pc);color:#fff}
.sec{font-weight:700;font-size:16px;margin:16px 0 8px}
ol.st{list-style:none;counter-reset:s;display:grid;gap:10px}
ol.st li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
ol.st li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;background:var(--pc);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.code{background:#eef2fa;border-radius:6px;padding:1px 8px;font-weight:700;font-family:Inter,monospace}
.fg{display:grid;gap:12px}
.fg label{font-size:14px;font-weight:600;display:grid;gap:5px}
.in{width:100%;border:1.5px solid #cfd9ec;border-radius:11px;padding:0 14px;height:50px;font-size:16px;background:#fff}
.in:focus{border-color:var(--pc);outline:0;box-shadow:0 0 0 3px #2a80f51f}
.hint{font-size:12.5px;color:var(--mut);font-weight:400}
.err{color:#c62828;font-size:13.5px;min-height:18px}
.cf{width:100%;min-height:54px;border-radius:13px;background:var(--pc);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.cf:active{transform:scale(.99)}
.qrbox{display:grid;place-items:center;padding:14px 0}.qrbox img{width:190px;height:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;mix-blend-mode:multiply}
.ok{text-align:center;padding:24px 16px 8px}
.tick{width:72px;height:72px;border-radius:50%;background:#e4f8ec;color:#1b9e55;display:grid;place-items:center;margin:0 auto 12px}
.ok h1{font-size:23px;margin-bottom:6px}.ok p{color:var(--mut);font-size:15px}
.rc{margin:14px 0;border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:#fff}
.rc div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #dbe4f3;font-size:14.5px}.rc div:last-child{border:0}.rc span{color:var(--mut)}.rc b{text-align:right;word-break:break-all}
.lk{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;font-weight:700;margin-top:10px;width:100%}
.wa{background:#25d366;color:#fff}.ol{border:1.5px solid #2a80f5;color:#2a80f5;background:#fff}
#t{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:30px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:92vw;text-align:center}
#t.s{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.m{height:90px}.qr{padding:6px 10px}.mt img{height:46px}}
body.one .mh{display:none}
body.one .pg{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
body.one #v-pay{flex:1;display:flex;flex-direction:column;min-height:0}
body.one .back{min-height:34px;margin-bottom:2px;align-self:flex-start}
body.one .ph{flex:1;display:flex;flex-direction:column;min-height:0;max-height:780px}
body.one .band{padding:10px 14px}body.one .band b{font-size:22px}
body.one .lg{height:50px;min-width:96px;padding:4px 10px}
body.one .bx{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:10px 14px 12px;min-height:0;overflow-y:auto}
body.one .num{margin:0;padding:8px 12px}body.one .num b{font-size:20px}
body.one ol.st{gap:6px}body.one ol.st li{font-size:13.5px;line-height:1.35;gap:10px}body.one ol.st li::before{flex-basis:22px;height:22px;font-size:12px;margin-top:0}
body.one .fg{gap:8px}body.one .fg label{font-size:13px;gap:3px}
body.one .in{height:44px}body.one .cf{min-height:48px;font-size:17px}
body.one .err{min-height:0}.err:empty{display:none}
body.one .qrbox{padding:0}body.one .qrbox img{width:128px;padding:8px}
@media(max-height:650px){body.one ol.st li{font-size:12.5px}body.one .in{height:40px}body.one .cf{min-height:44px}body.one .band b{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function show(v){document.body.classList.toggle('one',v=='pay');['home','pay','done'].forEach(function(x){$('#v-'+x).hidden=x!=v});window.scrollTo(0,0)}
function steps(k){var m=M[k],a=[];
 a.push('<b>'+m.n+' অ্যাপ</b> খুলে লগইন করুন');
 a.push('<b>Send Money</b> (সেন্ড মানি) এ চাপুন');
 a.push('ওপরের কপি করা নম্বরটি <b>পেস্ট</b> করুন');
 a.push('টাকা দিন: <b>'+money(AMT)+'</b>'+(REF?' · রেফারেন্স: <b>'+REF+'</b>':''));
 a.push('PIN দিয়ে বা বাটন চেপে ধরে কনফার্ম করুন');
 a.push('রিসিপ্টের <b>TrxID</b> কপি করে নিচে বসান');
 return '<ol class="st">'+a.map(function(x){return'<li><span>'+x+'</span></li>'}).join('')+'</ol>'}
function form(k,label){return '<form id="f" class="fg" novalidate><label>যে নম্বর থেকে পাঠিয়েছেন<input class="in" name="s" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="01XXXXXXXXX"></label><label>Transaction ID (TrxID)<input class="in" name="t" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="14" placeholder="যেমন: 8N7A6D5EE4" style="text-transform:uppercase"></label><div class="err" id="er" role="alert"></div><button class="cf" type="submit">পেমেন্ট কনফার্ম করুন</button></form>'}
function viewPay(k){var m=M[k];sel=k;document.documentElement.style.setProperty('--pc',m.c);
 $('#v-pay').innerHTML='<button class="back" data-go="home">← পেছনে যান</button><div class="ph"><div class="band"><div>পরিশোধযোগ্য টাকা<b>'+money(AMT)+'</b></div><div class="lg"><img src="'+IMG[k]+'" alt="'+m.n+'"></div></div><div class="bx"><div class="num"><div><small>'+m.n+' নম্বর (Send Money করুন)</small><b>'+CFG.wallets[k]+'</b></div><button class="cp" data-copy="'+CFG.wallets[k]+'">'+CP+' কপি</button></div>'+steps(k)+form(k,m.n)+'</div></div>';show('pay')}
function viewQr(){sel='qr';document.documentElement.style.setProperty('--pc','#16793a');
 $('#v-pay').innerHTML='<button class="back" data-go="home">← পেছনে যান</button><div class="ph"><div class="band"><div>পরিশোধযোগ্য টাকা<b>'+money(AMT)+'</b></div><div class="lg"><img src="'+IMG.qr+'" alt="Bangla QR"></div></div><div class="bx"><div class="qrbox"><img src="'+IMG.qr+'" alt="Bangla QR কোড"></div><ol class="st"><li><span>মোবাইল ব্যাংকিং অ্যাপে <b>Scan QR</b> খুলুন</span></li><li><span>QR স্ক্যান করে <b>'+money(AMT)+'</b> কনফার্ম করুন</span></li><li><span>রিসিপ্টের <b>TrxID</b> কপি করে নিচে বসান</span></li></ol>'+form('qr','')+'</div></div>';show('pay')}
function viewDone(){if(!last)return go('home');var r=last,wm=encodeURIComponent('পেমেন্ট কনফার্মেশন\nমার্চেন্ট: ফ্যাশন পয়েন্ট ('+fmt(CFG.merchantId)+')\nমাধ্যম: '+r.m+'\nটাকা: '+money(r.a)+'\nTrxID: '+r.t+'\nপ্রেরকের নম্বর: '+r.s);
 $('#v-done').innerHTML='<div class="ok"><div class="tick"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div><h1>পেমেন্ট তথ্য জমা হয়েছে</h1><p>আমরা TrxID যাচাই করে আপনার অর্ডার নিশ্চিত করব।</p></div><div class="rc"><div><span>মার্চেন্ট</span><b>ফ্যাশন পয়েন্ট</b></div><div><span>মাধ্যম</span><b>'+r.m+'</b></div><div><span>টাকা</span><b>'+money(r.a)+'</b></div><div><span>TrxID</span><b>'+r.t+'</b></div><div><span>প্রেরকের নম্বর</span><b>'+r.s+'</b></div><div><span>সময়</span><b>'+r.d+'</b></div></div><a class="lk wa" target="_blank" rel="noopener" href="https://wa.me/'+CFG.wa+'?text='+wm+'">WhatsApp-এ নিশ্চিত করুন</a>'+(RET?'<a class="lk ol" href="'+RET.replace(/"/g,'')+'">ওয়েবসাইটে ফিরে যান</a>':'<button class="lk ol" data-go="home">হোমে ফিরুন</button>');show('done')}
function go(v){location.hash=v=='home'?'':'#/'+v}
function route(){var h=location.hash.replace(/^#\/?/,''),p=h.split('/');
 if(p[0]=='pay'&&M[p[1]])return viewPay(p[1]);if(h=='qr')return viewQr();if(h=='done')return viewDone();
 document.documentElement.style.setProperty('--pc','#2a80f5');show('home');
 document.querySelectorAll('.m').forEach(function(b){b.classList.toggle('on',b.dataset.k==sel)})}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-k],[data-copy],#cpm,#pay');if(!b)return;
 if(b.dataset.k){sel=b.dataset.k;location.hash='#/pay/'+b.dataset.k}
 else if(b.dataset.go){b.dataset.go=='qr'?location.hash='#/qr':go(b.dataset.go)}
 else if(b.dataset.copy)copy(b.dataset.copy,'নম্বর কপি হয়েছে');
 else if(b.id=='cpm')copy(CFG.merchantId,'মার্চেন্ট নম্বর কপি হয়েছে');
 else if(b.id=='pay'){if(sel&&sel!='qr')location.hash='#/pay/'+sel;else if(sel=='qr')location.hash='#/qr';else toast('একটি পেমেন্ট মাধ্যম বেছে নিন')}});
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target,er=$('#er'),s=f.s.value.replace(/\D/g,''),t=f.t.value.trim().toUpperCase();
 if(!/^01[3-9]\d{8}$/.test(s)){er.textContent='সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন';f.s.focus();return}
 if(!/^[A-Z0-9]{6,14}$/.test(t)){er.textContent='সঠিক Transaction ID দিন (শুধু ইংরেজি অক্ষর ও সংখ্যা)';f.t.focus();return}
 var L=st('trx',[]);if(L.some(function(x){return x.t==t})){er.textContent='এই TrxID আগেই জমা দেওয়া হয়েছে';return}
 var d=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
 last={m:sel=='qr'?'Bangla QR':M[sel].n,a:AMT,t:t,s:s,d:d};L.unshift(last);sv('trx',L);location.hash='#/done'});
window.addEventListener('hashchange',route);route();
</script></body></html>
